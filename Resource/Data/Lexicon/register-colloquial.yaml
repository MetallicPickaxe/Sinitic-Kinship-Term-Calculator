# 全國通用口語層(register,非方言)
#
# 收錄準則:無明顯地域歸屬、全國通行的口語形。與方言層平行,但不綁地域。
# 鍵 = lexicon-standard 定出的標準形,或引擎構詞機算出的標準形。
meta:
  id: register-colloquial
  name: 通用口語
  layer: register
  provenance: 通行口語,非採自任何單一地方來源
  default_enabled: true

