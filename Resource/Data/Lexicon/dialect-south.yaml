# 南系口語層(dialect)
#
# 收錄準則:通行於南方(含閩、粵、吳)的地方口語形,以「公/婆」系祖輩稱為特徵。
# 鍵 = 標準形。本層可停用、可替換;停用後主位仍為標準漢語,不影響引擎正確性。
#
# ⚠ 出處(K14):本層詞彙部分與 mumuy 專案(MIT)所用形式重疊。mumuy 為南閩偏向,
#    本專案早期曾誤將其形式硬編入規則層當作主位(K16 反查證實),現外移為可選層。
meta:
  id: dialect-south
  name: 南系
  layer: dialect
  region: 南方(閩/粵/吳,未細分)
  provenance: 自本專案原始碼硬編字面外移(K16 反查,2026-07-20);形式與 mumuy(MIT)重疊
  default_enabled: true

variants:
  外祖父: [外公]
  外祖母: [外婆]
  曾祖父: [太公]
  曾祖母: [太婆]
