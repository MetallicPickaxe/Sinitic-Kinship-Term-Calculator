# 南系口語層(dialect)
#
# 收錄準則:通行於南方(含閩、粵、吳)的地方口語形,以「公/婆」系祖輩稱為特徵。
# 鍵 = 標準形。本層可停用、可替換;停用後主位仍為標準漢語,不影響引擎正確性。
#
# ⚠ 出處(K14):本層詞彙部分與 mumuy 專案(MIT)所用形式重疊。mumuy 為南閩偏向,
#    本專案早期曾誤將其形式硬編入規則層當作主位(K16 反查證實),現外移為可選層。
meta:
  id: dialect-south
  name: 南系
  layer: dialect
  region: 南方(閩/粵/吳,未細分)
  provenance: 自本專案原始碼硬編字面外移(K16 反查,2026-07-20);形式與 mumuy(MIT)重疊
  default_enabled: true

variants:
  外祖父: [外公]
  外祖母: [外婆]
  曾祖父: [太公]
  曾祖母: [太婆]
  外曾祖父: [外太公]
  外曾祖母: [外太婆]
  祖父: [阿公]
  祖母: [阿嬷]
  # 配偶側祖輩旁系的 公/婆 拼法(叔岳父 ≡ 叔公,南系)
  伯岳父: [伯公]
  叔岳父: [叔公]
  伯岳母: [伯婆]
  叔岳母: [叔婆]
  姑岳父: [姑公]
  姑岳母: [姑婆]
  舅岳父: [舅公]
  舅岳母: [舅婆]
  姨岳父: [姨公]
  姨岳母: [姨婆]
  伯祖父: [伯公, 大伯公]
  叔祖父: [叔公, 小叔公]
  伯祖母: [伯婆]
  叔祖母: [叔婆, 婶婆]
  姑祖母: [姑婆]
  姑祖父: [姑丈公, 姑公]
  舅祖父: [舅公]
  舅祖母: [舅婆]
  姨祖父: [姨公]
  姨祖母: [姨婆]
  姑外祖父: [姑外公]
  姑外祖母: [姑外婆]
  舅外祖父: [舅外公]
  舅外祖母: [舅外婆]
  姨外祖父: [姨外公]
  姨外祖母: [姨外婆]
  姑母: [姑妈]
  姨母: [姨妈]
  伯外祖父: [伯外公]
  伯外祖母: [伯外婆]
  叔外祖父: [叔外公]
  叔外祖母: [叔外婆]
  # 兩個構詞器對 外-槽位序不同(ChainShape 出 伯外祖父、NameFormatter 出 外伯祖父),
  # 同一人兩種標準拼法,兩邊都給鍵。
  外伯祖父: [伯外公]
  外伯祖母: [伯外婆]
  外叔祖父: [叔外公]
  外叔祖母: [叔外婆]
  外姑祖父: [姑外公]
  外姑祖母: [姑外婆]
  外舅祖父: [舅外公]
  外舅祖母: [舅外婆]
  外姨祖父: [姨外公]
  外姨祖母: [姨外婆]
  # 曾-層祖輩旁系
  伯曾祖父: [太公]
  伯曾祖母: [太婆]
  叔曾祖父: [太公]
  叔曾祖母: [太婆]
  姑曾祖母: [太婆]
  舅曾祖父: [太公]
  姨曾祖母: [太婆]
